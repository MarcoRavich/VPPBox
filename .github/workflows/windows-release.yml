name: Windows build and release
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'Scripts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=vapourbox_hwenc .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package portable app
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $release)) { throw "Build output not found: $release" }
          Compress-Archive -Path "$release/*" -DestinationPath 'VPPBox-Windows-x64.zip' -Force
      - name: Publish commit-specific release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Windows build ${{ github.sha }}
          body: |
            Automated Windows x64 build for commit ${{ github.sha }}.
            NVEncC is not bundled and must be obtained separately from rigaya.
          files: VPPBox-Windows-x64.zip
          fail_on_unmatched_files: true
